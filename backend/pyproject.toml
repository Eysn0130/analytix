[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytix-data-analysis-backend"
version = "0.1.0"
description = "FastAPI local data analysis service for analytix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "duckdb==1.5.4",
  "sqlglot>=25.0.0,<27.0.0",
  "pandas>=2.1.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "cryptography>=46.0.0",
  "msoffcrypto-tool>=5.4.0",
  "pypdf>=6.8.0",
  "pypdfium2>=4.30.0",
  "pytesseract>=0.3.13",
  "Pillow>=11.1.0",
  "reportlab>=4.4.0",
  "python-docx>=1.1.2",
  "PyYAML>=5.1",
  "requests>=2.32.0",
  "tomli>=2.0.1; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0.0",
  "httpx>=0.27.0,<1.0.0",
  "xlwt>=1.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
