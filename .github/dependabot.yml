version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories: [/, /packages/runtime, /plugins/atlasflow/skills/atlasflow]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development-tools:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
    # Major framework migrations stay separate reviewable PRs. Never fold an
    # Electron/TypeScript/Vite/Tailwind migration into a maintenance batch.
  - package-ecosystem: gomod
    directory: /packages/runtime-go
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directories: [/tools/import_accelerator, /tools/cleaning_ops, /tools/analysis_compute, /tools/data_engine]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
