version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories: [/, /packages/runtime]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development-tools:
        dependency-type: development
  - package-ecosystem: gomod
    directory: /packages/runtime-go
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
