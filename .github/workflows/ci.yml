name: Development CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-baseline:
    name: Source baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/runtime/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - name: Install locked dependencies (including runtime)
        run: npm ci
      - name: Inspect actual public candidate ancestry and source policy
        run: node scripts/check-public-push.mjs --candidate
      - name: Validate workflow syntax and security-sensitive expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify development inputs, sync regressions, types and source build
        run: npm run verify:baseline
      - name: Verify deterministic Funds entry and report-scenario contracts
        run: npm run test:plugin-contracts

  application-tests:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - run: npm ci
      # vitest.config.ts already bounds workers; do not suppress failing assertions.
      - run: |
          # Private-authority fixtures require owner-only creation, matching the
          # qualified local helper. This does not change production validators.
          umask 077
          npm test -- --tags-filter='!macos-integration'

  macos-integration:
    name: macOS process integration
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - run: npm ci
      - name: Exercise actual native process containment
        working-directory: packages/runtime-go
        run: |
          umask 077
          go test -count=1 -p 1 -parallel 2 -timeout 5m \
            ./internal/adapters/outbound/processsandbox \
            ./internal/adapters/outbound/process
      - name: Execute all macOS integration contracts with synthetic providers
        run: |
          umask 077
          npm test -- --tags-filter=macos-integration

  filesystem-contracts:
    name: Filesystem contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - name: Verify native filesystem contracts on the actual host
        working-directory: packages/runtime-go
        run: |
          umask 077
          go test -count=1 -p 1 -parallel 2 -timeout 5m \
            ./internal/testsupport/userconfigtest \
            ./internal/adapters/outbound/securegeneration \
            ./internal/adapters/outbound/finalauthority \
            ./internal/adapters/outbound/rawartifact \
            ./internal/adapters/outbound/persistencefs

  go-tests:
    name: Go tests (${{ matrix.tags }})
    needs: filesystem-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tags: ['', analytix_prod]
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - name: Test all Go packages with bounded concurrency
        working-directory: packages/runtime-go
        env:
          TEST_TAGS: ${{ matrix.tags }}
        run: |
          umask 077
          go test -count=1 -p 1 -parallel 2 -timeout 20m -tags "$TEST_TAGS" ./...

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock
      - run: python -m pip install uv==0.11.5
      - name: Install the checked-in backend dependency resolution
        run: uv sync --project backend --locked --extra dev --python 3.11
      - run: uv run --project backend --no-sync python -m pytest backend/tests -q

  rust-tests:
    name: Rust unit contracts (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: [import_accelerator, cleaning_ops, analysis_compute, data_engine]
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Test native component source contracts (not production execution admission)
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          umask 077
          cargo test --locked --manifest-path "tools/$COMPONENT/Cargo.toml" --all-targets

  development-gate:
    name: Development gate
    if: ${{ always() }}
    needs: [source-baseline, application-tests, macos-integration, filesystem-contracts, go-tests, backend-tests, rust-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject failed, cancelled, skipped or missing required suites
        env:
          DEVELOPMENT_CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/development-ci-gate.mjs
