name: Development CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-baseline:
    name: Source baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/runtime/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - name: Install locked dependencies (including runtime)
        run: npm ci
      - name: Validate workflow syntax and security-sensitive expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify development inputs, sync regressions, types and source build
        run: npm run verify:baseline

  application-tests:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - run: npm ci
      # vitest.config.ts already bounds workers; do not suppress failing assertions.
      - run: npm test

  go-tests:
    name: Go tests (${{ matrix.tags }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tags: ['', analytix_prod]
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/runtime-go/go.sum
      - name: Test all Go packages with bounded concurrency
        working-directory: packages/runtime-go
        env:
          TEST_TAGS: ${{ matrix.tags }}
        run: go test -count=1 -p 1 -parallel 2 -timeout 10m -tags "$TEST_TAGS" ./...

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install './backend[dev]'
      - run: python -m pytest backend/tests -q
