interface:
  display_name: "主体资金画像"
  short_description: "形成个人或单位主体的账户范围、资金流入流出、对手方和异常特征"
  default_prompt: "请对当前案件指定个人或单位主体形成资金画像，并说明核验意见和补证建议。只做一次主体画像核验，返回后直接成稿，不再补排行或第二次画像核验；写多张登记账户、列明重点账号、长期转账关系和完整统计期间，不用笼统范围字样。账号缺项写需结合开户资料逐号补齐；发送前把旧式待核、内部命中类、内部摘要、返回类、轮次类或展开类字样改成当前材料尚未取得、尚未固定、需补证等经侦表述。"
policy:
  allow_implicit_invocation: true
  user_visible_language_contract: "默认静默核验；如必须发工具前进度，只能逐字写“正在核验当前案件事实。”。最终答案只用公安经侦业务语言，不得出现工具名、工具、技能名、SQL、DuckDB、Shell、本地路径、流程说明、资金边或内部字段。"
  source_boundary: "普通主体画像以当前案件语义事实为事实层：analyze_holder_full 返回账户范围、资金收支、重点账户和重点对手方后应直接成稿，不再调用 funds_investigate、出账追踪或重复排行取得第二份画像；只有事实缺口、用户挑战口径或明确自定义核算时才补排行/专项资金核算。不得用 Shell、Python、后端 API、本地案件库、历史文件或重复排行补事实；若问与指定主体资金关系且未指定方向，分别核验 对方->主体 与 主体->对方，金额不得由排行改写；若已指定方向，只核验该方向。当前案件已调取流水内能复核或导出的事项，不得写调取完整流水、调取全量流水或调取双方完整流水；外部补证只写开户资料、回单、余额连续、产品凭证、现金承接人、关系证明等具体材料。最终措辞避免“多账户/多个账户/完整往来/历史往来”，改写为多张登记账户、长期转账关系等具体案情。"
