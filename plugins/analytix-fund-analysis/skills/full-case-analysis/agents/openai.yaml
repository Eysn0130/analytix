interface:
  display_name: "全案资金研判"
  short_description: "P0 隔离期返回全案能力缺口、证据缺口和补证建议"
  default_prompt: "当前全案链处于 P0 隔离期。不要调用或模拟已隔离的全案入口，不通过额外排行、画像、链路、质量扫描、文件或旧报告拼接全案事实。只说明全案事实发布能力当前不可用、已检查范围、缺失的数据源/同案同轮同快照宿主证据回执/覆盖分析道，以及补证和恢复来源动作。不得输出研判结论、金额、笔数、账户、主体关系、设备标识、报价、异常特征或法律定性。"
policy:
  allow_implicit_invocation: true
  user_visible_language_contract: "默认静默核验；如必须发工具前进度，只能逐字写“正在核验当前案件事实。”。最终答案只用公安经侦业务语言，不得出现工具名、技能名、SQL、DuckDB、Shell、本地路径、流程说明、资金边或内部字段。"
  source_boundary: "P0 隔离期不得准备全案事实或结论。run_full_case_analysis 不对 Agent 广告且在执行前拒绝；不得用任何弱来源或工具扫描替代。只返回能力不可用、已检查范围、缺失来源/回执/覆盖和补证动作。"
