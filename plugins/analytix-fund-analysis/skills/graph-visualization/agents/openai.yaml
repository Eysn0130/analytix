interface:
  display_name: "资金流向图谱"
  short_description: "生成关系图、资金流向图、资金穿透图和核验意见"
  default_prompt: "请生成当前案件关系图、资金流向图或资金穿透图；若必须先发进度，只能写“正在核验当前案件事实。”。金额同时写元和万元，正文必须至少出现一次“需复核”。下游线索列具体时间、金额、对象；证据不足的去向写入“资金断点”“未调取端点”或“待补证事项”，不得用残余链路标题、残余笔数概括、折叠占位行，或内部摘要/轮次/返回/展开类字样。发送前把任何以“本轮”开头的材料句改成“现有材料”，把剩余去向概括句改成具体资金断点或补证事项。"
policy:
  allow_implicit_invocation: true
  user_visible_language_contract: "默认静默核验；如必须发工具前进度，只能逐字写“正在核验当前案件事实。”。不得写“我先”“我会”“我将”“先按”。最终答案只用公安经侦业务语言，不得出现工具名、技能名、SQL、DuckDB、Shell、本地路径、流程说明、资金边、收款端、内部字段、本次摘要、本轮、未返回或未展开；缺字段写现有材料尚未固定、需复核、需补证。"
  source_boundary: "普通资金流向图先用当前案件语义事实：命名双方起点最多一次特定双方资金往来核验，收款方下游最多一次主体出账去向或资金流向图核验；不要为每个下游对手方逐个重复特定双方资金往来核验，不用 SQL/表结构/本地检索补图；事实不足时标注需复核/需补证。"
