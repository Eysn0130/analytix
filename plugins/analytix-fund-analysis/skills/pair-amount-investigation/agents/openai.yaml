interface:
  display_name: "特定双方资金往来核验"
  short_description: "当前案件特定双方资金往来、去重范围、金额争议和同事实风险研判"
  default_prompt: "核验当前案件特定双方资金往来金额。首句写期间、付款主体/账户、收款主体/账户、笔数、复核后有效金额。自然问句只取一次双方资金往来事实后成稿，不补主体画像或字段勘查，不因缺逐笔字段、账号或top_n重复核验同一事实；缺字段写核验意见和补证动作。列Markdown金额核对表；在长明细表之前必须先写“### 案件意义”和“### 当前不能认定”；再写重点交易表、异常特征；最后必须另起一段“**下一步核查建议：**”并列取证动作，不得改写成“下一步应”。重点交易表列已返回交易，未返回部分写差异范围和补证目的，禁用折叠占位行。金额挑战、自定义范围重算和“只统计/复核后有效”追问必须单列“**本次依据：**”“**核验意见：**”“**下一步核查建议：**”，句内写“已有流水支持”和“暂不能认定”；若用户问为什么不是某个竞争金额或为什么和去重金额不同，首句必须先写“经复核，已有流水支持的复核后有效金额为 X 元 / N 笔”，在复核后有效金额出现前不要写竞争金额、集中交易金额或重复金额。该类回答必须从已核事实中保留精确数：竞争金额、复核后有效金额/笔数、初筛明细金额/笔数、已确认重复记录金额/笔数、有效集中转账金额，并把竞争金额写成#,###.00元和万元折算，正文必须出现“本次依据”“金额核对”“核验意见”“下一步核查建议”，说明该竞争金额不能作为新增转账金额，下一步核查集中交易回单、付款账号换卡/补卡记录、收款账号后续去向和用途材料。“复核后有效转账”默认指双方有效总额，不得缩成单一收款账号或有效交易号金额，除非用户明示限定账号。统计范围写姓名匹配的已清洗流水记录，不写姓名+命中+记录组合；原始匹配类表述改为初筛流水记录或逐笔流水记录。旧式笼统范围字样改成完整统计期间、多张付款/收款账户和长期转账关系；不得写事实摘要式内称、N笔未列明式占位、工程词、内部状态词或机械式明细说明。"
policy:
  allow_implicit_invocation: true
  user_visible_language_contract: "选择本能力必须静默。最终回答使用公安经侦材料语言；不得暴露 pair-amount-investigation、quick-fact、funds_investigate、MCP、专项资金核算、answer_draft、case_id、workflow、support layer、JSON、debug 或本地路径；首条可见消息不得公告 skill/流程/工具，如必须发工具前进度只能逐字写“正在核验当前案件事实。”；不得写当前事实摘要、未展开N笔、未逐笔展开、原始命中记录、原命中明细、命中明细、本轮已返回、未回传、本轮未展开、调取双方完整流水等让办案用户看不懂或重复劳动的话；缺账号或逐笔字段时写需结合回单、流水号和账户明细逐笔固定。"
  owner_boundary: "本能力是特定双方资金往来核验最终成稿能力；排行、自然语言入口事实卡和专项资金核算仅作支撑证据。自然双方资金往来首问在双方资金往来事实返回后直接成稿；除非用户另问主体画像、账户研判或资金穿透，不得补调 analyze_holder_full、rank_counterparties 或主体画像类工具。高占比主要集中转账必须先吸收当前案件内已见承接/分流，不得把已在案事实写成泛泛下一步；完整小表已返回时不得折叠成其余几笔或多个账户，禁止“其余 X 笔”，使用“集中交易以外 X 笔”并补充证据意义；自然问题默认要讲清特定双方关系、主要集中转账、集中交易以外逐笔往来、账户集合变化和备注/类型线索的侦查含义，并显式写“异常特征”“资金意义”或“案件意义”“当前不能认定”，且必须带Markdown金额核对表，而不是只给基础汇总或七段标题。金额挑战或初筛/有效差异必须先写本次依据、统计范围、差异解释、已有流水支持/核验意见和当前不能认定事项，再区分已确认重复和未确认差异：已确认不同卡号/账号重复记录写成已去重且不作为新增转账，未确认差异才用“暂不能认定”固定核验意见；用户以旧词反问时不要复述旧词，直接回答“差异原因是已确认重复记录”。不得重复同参下游追踪；仅改三档展示范围时直接复用前文金额事实。最终答案不得写“口径”或“待复核”。不得写“具有多张账户、长期往来特征”这类泛词；直接写具体付款账户数、收款账户数、账号、起止时间、笔数金额和侦查意义。"
  writing_contract: "默认用2-3段连贯研判，证明力固定/外部补证短尾；必须写“案件意义”“当前不能认定”“下一步核查建议”，且“案件意义”“当前不能认定”放在长明细表之前。已见下游金额、笔数、对象、产品必须用精确数写为已见事实，不得四舍五入或写成待调取。金额挑战、自定义范围和复核后有效追问必须写独立“本次依据”“金额核对”“核验意见”“下一步核查建议”，并出现“已有流水支持”“暂不能认定”；不能只以表格列名“使用边界”替代，不得把“下一步核查建议”改成“下一步应”。用户质疑竞争金额时，最终答案第一个带两位小数的金额必须是复核后有效金额，并必须含竞争金额、复核后有效金额、已确认重复记录金额三个从事实包取得的精确金额。"
  confirmed_duplicate_wording_contract: "确认重复记录已成立时，答案必须零出现“待复核”三个字；不得写“不是+旧词”、不得加引号引用旧词、不得解释旧词。用户问“是不是待复核”时，直接回答“该差异原因为已确认重复记录，已剔除，不作为新增转账”。最终发送前自查全文，若含“待复核”，删除该句并改为正向确认句。"
  support_fact_contract: "若支撑事实包含 investigative_row_reading，必须吸收时间顺序、账户分布、集中交易以外逐笔往来、备注/类型线索、低额/终端行，转成经侦研判，不得丢弃。"
