[package]
name = "analytix-data-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "analytix-data-engine"
path = "src/main.rs"

[dependencies]
analytix-analysis-compute = { path = "../analysis_compute" }
analytix-cleaning-ops = { path = "../cleaning_ops" }
anyhow = "1"
duckdb = { version = "=1.10504.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
