      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--analytix-startup-background);
      }

      body {
        outline: none;
      }

      .analytix-startup-loader {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--analytix-startup-background);
        -webkit-app-region: drag;
      }

      .analytix-startup-loader__logo {
        position: relative;
        display: inline-flex;
        width: 50px;
        height: 50px;
        opacity: 0;
        animation: analytix-startup-loader-fade-in 180ms ease-out 60ms forwards;
      }

      .analytix-startup-loader__base,
      .analytix-startup-loader__overlay {
        position: absolute;
        inset: 0;
        background-repeat: no-repeat;
        -webkit-mask-image: var(--analytix-startup-loader-mask);
        mask-image: var(--analytix-startup-loader-mask);
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
      }

      .analytix-startup-loader__base {
        background-color: var(--analytix-startup-logo-base);
      }

      .analytix-startup-loader__overlay {
        animation: analytix-startup-loader-shimmer 2200ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
        background-image: linear-gradient(
          112deg,
          transparent 22%,
          var(--analytix-startup-logo-shimmer-soft) 38%,
          var(--analytix-startup-logo-shimmer-peak) 49%,
          var(--analytix-startup-logo-shimmer-tail) 56%,
          transparent 74%
        );
        background-position: 140% 0;
        background-size: 220% 100%;
      }

      @keyframes analytix-startup-loader-fade-in {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

      @keyframes analytix-startup-loader-shimmer {
        0% {
          background-position: 140% 0;
        }

        100% {
          background-position: -120% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .analytix-startup-loader__logo {
          opacity: 1;
          animation: none;
        }

        .analytix-startup-loader__overlay {
          animation: none;
        }
      }
    </style>

        <div class="analytix-startup-loader__logo" aria-hidden="true">
          <div class="analytix-startup-loader__base"></div>
          <div class="analytix-startup-loader__overlay"></div>
        </div>
      </div>
    </div>
