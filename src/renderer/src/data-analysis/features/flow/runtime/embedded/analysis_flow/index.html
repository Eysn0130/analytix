<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Analytix · 可视化分析</title>
    <!-- Reuse the same visual language as 统计分析 -->
    <link rel="stylesheet" href="../analysis_stats/app.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="ghostFloat" id="ghostFloat" aria-hidden="true">
      <div class="ghostFloatNode" id="ghostFloatNode"></div>
    </div>
    <div class="modalMask" id="edgeLabelModal" aria-hidden="true">
      <div class="modalCard" id="edgeLabelCard" role="dialog" aria-modal="true" aria-labelledby="edgeLabelTitle">
        <div class="modalTitle" id="edgeLabelTitle">编辑连线文本</div>
        <div class="modalBody">
          <input class="input" id="edgeLabelInput" placeholder="输入文本内容…" />
          <div class="modalHint" id="edgeLabelHint">双击线条可再次编辑</div>
          <div class="edgeTxnReadonly" id="edgeLabelReadonly" hidden></div>
        </div>
        <div class="modalActions">
          <button class="btn ghost" id="edgeLabelCancel" type="button">取消</button>
          <button class="btn primary" id="edgeLabelSave" type="button">确定</button>
        </div>
      </div>
    </div>
    <div class="modalMask confirmMask" id="viewCloseModal" aria-hidden="true">
      <div class="modalCard confirmCard" role="dialog" aria-modal="true" aria-labelledby="viewCloseTitle">
        <div class="confirmHeader">
          <div class="confirmIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M6 6L18 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M18 6L6 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="confirmTitleWrap">
            <div class="modalTitle" id="viewCloseTitle">再次确认关闭</div>
            <div class="confirmSubtitle" id="viewCloseSubtitle">关闭画布视图</div>
          </div>
        </div>
        <div class="confirmMeta">
          <div class="confirmName" id="viewCloseName">视图</div>
          <span class="confirmTag" id="viewCloseStatus">未存储</span>
        </div>
        <div class="modalBody confirmBody">
          <div class="confirmMessage" id="viewCloseMessage">关闭后将从视图列表移除。</div>
          <div class="confirmHint" id="viewCloseHint">建议先存储视图，避免误删。</div>
        </div>
        <div class="modalActions">
          <button class="btn ghost" id="viewCloseCancel" type="button">取消</button>
          <button class="btn danger" id="viewCloseConfirm" type="button">关闭</button>
        </div>
      </div>
    </div>
    <div class="app">
      <!-- LEFT: Seed selector -->
      <section class="card left" id="leftCard">
        <div class="leftHeader">
          <div class="titleRow">
            <div class="title">可视化分析</div>
            <div class="titleActions">
              <div class="badge" id="caseBadge" title="当前案件">
                <span class="badgeDot"></span>
                <span class="badgeText" id="caseBadgeText">未选择案件</span>
              </div>
            </div>
          </div>
        </div>

        <div class="segmented" role="tablist" aria-label="对象维度">
          <div class="segWrap">
            <button class="segBtn active" id="tabByName" role="tab" aria-selected="true" type="button">按户名</button>
            <button class="segBtn" id="tabByCard" role="tab" aria-selected="false" type="button">按卡号</button>
          </div>
        </div>

        <div class="leftSearch">
          <input class="input" id="leftSearch" placeholder="搜索：户名 / 卡号 / 证件号 / 开户行…" autocomplete="off" />
          <button class="iconBtn" id="leftSearchClear" title="清空" type="button" aria-label="清空搜索">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M6 6L18 18" stroke="rgba(2,6,23,.55)" stroke-width="2" stroke-linecap="round" />
              <path d="M18 6L6 18" stroke="rgba(2,6,23,.55)" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <div class="leftTools">
          <div class="toolBtns">
            <button class="chipBtn" id="btnSelectAll" type="button">全选</button>
            <button class="chipBtn ghost" id="btnClearAll" type="button">清空</button>
          </div>
          <div class="selCount" id="selCount">已选 0</div>
        </div>

        <div class="leftOpts">
          <div class="optRow">
            <div class="optLabel">方向</div>
            <div class="segSmall" role="tablist" aria-label="资金方向">
              <button class="segMini active" data-dir="all" type="button">全部</button>
              <button class="segMini" data-dir="in" type="button">流入</button>
              <button class="segMini" data-dir="out" type="button">流出</button>
            </div>
          </div>
          <div class="optRow">
            <div class="optLabel">层级</div>
            <input class="range" id="hop" type="range" min="1" max="3" value="1" />
            <div class="optValue" id="hopText">1</div>
          </div>
          <div class="optRow">
            <div class="optLabel">最小金额</div>
            <input class="input sm" id="minAmount" value="0" inputmode="decimal" />
          </div>
          <div class="optRow">
            <div class="optLabel">最大边数</div>
            <input class="input sm" id="maxEdges" value="800" inputmode="numeric" />
          </div>
        </div>

        <div class="tree" id="tree" aria-label="对象列表"></div>

        <div class="leftBottom">
          <button class="btn primary full" id="btnBuild" type="button">生成图谱</button>
          <button class="btn ghost full" id="btnClearGraph" type="button">清空图谱</button>
        </div>
      </section>

      <button class="gapToggle" id="gapToggle" title="折叠" type="button" aria-label="折叠左侧" aria-expanded="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M15 6l-6 6 6 6" stroke="rgba(2,6,23,.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- RIGHT -->
      <section class="right">
        <section class="card toolBarCard ribbon" id="graphToolbar" role="toolbar" aria-label="图谱工具栏">
          <div class="ribbonGroup styleGroup" role="group" aria-labelledby="graphToolbarStyleCaption">
            <div class="ribbonGroupBody styleBlocks">
              <div class="ribbonSub typography textBlock ribbonSubLined">
                <div class="ribbonSubBody typoGrid">
                  <div class="typoRow top">
                    <div class="comboField">
                      <button
                        class="comboBtn"
                        id="btnFontFamily"
                        type="button"
                        aria-label="字体"
                        aria-haspopup="dialog"
                        aria-controls="ribbonPopover"
                        aria-expanded="false"
                      >
                        <svg class="ico"><use href="#ico-font"></use></svg>
                        <span class="comboLabel" id="fontFamilyLabel">思源黑体</span>
                        <svg class="ico caret"><use href="#ico-caret"></use></svg>
                      </button>
                    <button
                      class="comboBtn narrow"
                      id="btnFontSize"
                      type="button"
                      aria-label="字号"
                      aria-haspopup="dialog"
                      aria-controls="ribbonPopover"
                      aria-expanded="false"
                    >
                      <span class="comboLabel" id="fontSizeLabel">13</span>
                      <svg class="ico caret"><use href="#ico-caret"></use></svg>
                    </button>
                    </div>
                    <div class="splitBtns">
                      <button class="ribbonMini sizeBtn" id="btnFontInc" type="button" aria-label="字号加一">
                        <svg class="ico"><use href="#ico-text-plus"></use></svg>
                      </button>
                      <button class="ribbonMini sizeBtn" id="btnFontDec" type="button" aria-label="字号减一">
                        <svg class="ico"><use href="#ico-text-minus"></use></svg>
                      </button>
                    </div>
                  </div>
                  <div class="typoRow bottom">
                    <div class="toggleRow">
                      <button class="ribbonMini toggle" id="btnBold" type="button" aria-label="加粗" aria-pressed="false">B</button>
                      <button class="ribbonMini toggle" id="btnItalic" type="button" aria-label="斜体" aria-pressed="false">I</button>
                      <button class="ribbonMini toggle" id="btnUnderline" type="button" aria-label="下划线" aria-pressed="false">U</button>
                      <button class="ribbonMini toggle" id="btnShadow" type="button" aria-label="文字阴影" aria-pressed="false">S</button>
                    </div>
                    <div class="colorRow">
                      <button
                        class="ribbonColorBtn compact"
                        id="btnTextColor"
                        type="button"
                        data-color-target="textColor"
                        aria-label="文字颜色"
                        aria-haspopup="dialog"
                        aria-controls="ribbonPopover"
                        aria-expanded="false"
                      >
                        <span class="colorSwatch" id="textColorSwatch"></span>
                        <span class="colorLabel">字体</span>
                        <svg class="ico caret"><use href="#ico-caret"></use></svg>
                      </button>
                      <button
                        class="ribbonColorBtn compact"
                        id="btnOutlineColor"
                        type="button"
                        data-color-target="outlineColor"
                        aria-label="轮廓颜色"
                        aria-haspopup="dialog"
                        aria-controls="ribbonPopover"
                        aria-expanded="false"
                      >
                        <span class="colorSwatch" id="outlineColorSwatch"></span>
                        <span class="colorLabel">轮廓</span>
                        <svg class="ico caret"><use href="#ico-caret"></use></svg>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="ribbonSubCaption ribbonSubBaseline" aria-hidden="true"></div>
              </div>
              <div class="ribbonSubDivider">｜</div>

              <div class="ribbonSub edgeBlock ribbonSubLined">
                <div class="ribbonSubBody edgeGrid">
                  <button
                    class="ribbonCellBtn inline"
                    id="btnLineStyle"
                    type="button"
                    aria-label="线型"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
                    <svg class="ico"><use href="#ico-line-style"></use></svg>
                    <span class="btnText" id="lineStyleLabel">线型</span>
                    <svg class="ico caret"><use href="#ico-caret"></use></svg>
                  </button>
                  <button
                    class="ribbonCellBtn inline"
                    id="btnLineWidth"
                    type="button"
                    aria-label="线宽"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
                    <svg class="ico"><use href="#ico-line-width"></use></svg>
                    <span class="btnText" id="lineWidthLabel">线宽</span>
                    <svg class="ico caret"><use href="#ico-caret"></use></svg>
                  </button>
                  <button
                    class="ribbonCellBtn inline"
                    id="btnLineArrow"
                    type="button"
                    aria-label="线条方向"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
                    <svg class="ico"><use href="#ico-arrow"></use></svg>
                    <span class="btnText" id="lineArrowLabel">方向</span>
                    <svg class="ico caret"><use href="#ico-caret"></use></svg>
                  </button>
                </div>
                <div class="ribbonSubCaption ribbonSubBaseline" aria-hidden="true"></div>
              </div>
              <div class="ribbonSubDivider">｜</div>

              <div class="ribbonSub nodeBlock">
                <div class="ribbonSubBody nodeGrid">
                  <button
                    class="ribbonCellBtn inline nodeCell nodeCell-shape"
                    id="btnNodeShape"
                    type="button"
                    aria-label="节点形状"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
                    <svg class="ico"><use href="#ico-node-shape"></use></svg>
                    <span class="btnText" id="nodeShapeLabel">形状</span>
                    <svg class="ico caret"><use href="#ico-caret"></use></svg>
                  </button>
                  <button
                    class="ribbonColorBtn compact nodeCell nodeCell-fill nodeFillBtn"
                    id="btnNodeFill"
                    type="button"
                    data-color-target="nodeFill"
                    aria-label="节点填充颜色"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
                    <span class="colorSwatch" id="nodeFillSwatch"></span>
                    <span class="colorLabel">填充</span>
                    <svg class="ico caret"><use href="#ico-caret"></use></svg>
                  </button>
                  <button
                    class="ribbonCellBtn inline nodeCell nodeCell-size"
                    id="btnIconSize"
                    type="button"
                    aria-label="节点大小"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
                    <svg class="ico"><use href="#ico-icon-size"></use></svg>
                    <span class="btnText" id="iconSizeLabel">大小</span>
                    <svg class="ico caret"><use href="#ico-caret"></use></svg>
                  </button>
                  <button class="ribbonCellBtn inline nodeCell nodeCell-new" id="btnNodeNew" type="button">
                    <svg class="ico"><use href="#ico-plus"></use></svg>
                    <span class="btnText">新建</span>
                  </button>
                  <button
                    class="ribbonCellBtn inline nodeCell nodeCell-style"
                    id="btnIconLibrary"
                    type="button"
                    aria-label="节点样式库"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
                    <svg class="ico"><use href="#ico-icon-library"></use></svg>
                    <span class="btnText">样式</span>
                    <svg class="ico caret"><use href="#ico-caret"></use></svg>
                  </button>
                  <button class="ribbonCellBtn inline nodeCell nodeCell-link" id="btnNodeLink" type="button">
                    <svg class="ico"><use href="#ico-link"></use></svg>
                    <span class="btnText">链接</span>
                  </button>
                </div>
                <div class="ribbonSubCaption ribbonSubBaseline" aria-hidden="true"></div>
              </div>
            </div>
            <div class="ribbonCaption ribbonCaptionGhost" id="graphToolbarStyleCaption">样式</div>
          </div>

          <div class="ribbonSubDivider">｜</div>

          <div class="ribbonGroup layoutGroup" role="group" aria-labelledby="graphToolbarLayoutCaption">
            <div class="ribbonGroupBody layoutGrid">
              <button class="ribbonTile layoutBtn active" id="btnLayoutCompact" type="button" data-layout="compact">
                <svg class="ico"><use href="#ico-layout-compact"></use></svg>
                <span class="btnText">关联图</span>
              </button>
              <button class="ribbonTile layoutBtn" id="btnLayoutNetwork" type="button" data-layout="network">
                <svg class="ico"><use href="#ico-layout-network"></use></svg>
                <span class="btnText">网络图</span>
              </button>
              <button class="ribbonTile layoutBtn" id="btnLayoutHierarchy" type="button" data-layout="hierarchy">
                <svg class="ico"><use href="#ico-layout-hierarchy"></use></svg>
                <span class="btnText">层级图</span>
              </button>
              <button class="ribbonTile layoutBtn" id="btnLayoutFlow" type="button" data-layout="flow">
                <svg class="ico"><use href="#ico-layout-flow"></use></svg>
                <span class="btnText">流向图</span>
              </button>
            </div>
            <div class="ribbonCaption ribbonCaptionBaseline" id="graphToolbarLayoutCaption">布局</div>
          </div>

          <div class="ribbonSubDivider">｜</div>

	          <div class="ribbonGroup analyzeGroup" role="group" aria-labelledby="graphToolbarAnalyzeCaption">
	            <div class="ribbonGroupBody analyzeGrid">
	              <div class="ribbonRow analyzeTopRow">
	                <button
                    class="ribbonTile analysisCmdBtn drop"
                    id="btnAnalysisFilter"
                    type="button"
                    aria-label="筛选"
                    title="按金额筛选"
                    aria-haspopup="dialog"
                    aria-controls="ribbonPopover"
                    aria-expanded="false"
                  >
	                  <svg class="ico"><use href="#ico-filter"></use></svg>
	                  <span class="btnText">筛选</span>
	                  <svg class="ico caret"><use href="#ico-caret"></use></svg>
	                </button>
	                <button class="ribbonTile analysisCmdBtn" id="btnAnalysisCollapse" type="button">
	                  <svg class="ico"><use href="#ico-collapse"></use></svg>
	                  <span class="btnText">收缩</span>
	                </button>
	                <button class="ribbonTile comboBtn" id="btnGroup1" type="button">
	                  <span class="btnText">组合 1</span>
	                </button>
	                <button class="ribbonTile comboBtn" id="btnGroup2" type="button">
	                  <span class="btnText">组合 2</span>
	                </button>
	                <button class="ribbonTile comboBtn" id="btnGroup3" type="button">
	                  <span class="btnText">组合 3</span>
	                </button>
		                <button
                      class="ribbonTile comboBtn drop"
                      id="btnGroupOps"
                      type="button"
                      aria-label="组合运算"
                      aria-haspopup="dialog"
                      aria-controls="ribbonPopover"
                      aria-expanded="false"
                    >
	                  <span class="btnText">更多</span>
	                  <svg class="ico caret"><use href="#ico-caret"></use></svg>
	                </button>
	              </div>
	              <div class="ribbonRow row3 analyzeBottomRow">
	                <button class="ribbonTile analysisBtn" id="btnEncodeWidth" type="button">
	                  <svg class="ico"><use href="#ico-encode-width"></use></svg>
	                  <span class="btnText">金额→粗细</span>
                </button>
                <button class="ribbonTile analysisBtn" id="btnEncodeColor" type="button">
                  <svg class="ico"><use href="#ico-encode-color"></use></svg>
                  <span class="btnText">金额→颜色</span>
                </button>
                <button class="ribbonTile analysisBtn" id="btnNodeScale" type="button">
                  <svg class="ico"><use href="#ico-node-scale"></use></svg>
                  <span class="btnText">节点缩放</span>
                </button>
              </div>
            </div>
	            <div class="ribbonCaption ribbonCaptionBaseline" id="graphToolbarAnalyzeCaption">分析</div>
          </div>

          <div class="ribbonSubDivider">｜</div>

          <div class="ribbonGroup opsGroup" role="group" aria-labelledby="graphToolbarOpsCaption">
            <div class="ribbonGroupBody opsGrid">
              <div class="ribbonRow row2">
                <button class="ribbonTile mergeBtn" id="btnMergeNodes" type="button">
                  <svg class="ico"><use href="#ico-group-2"></use></svg>
                  <span class="btnText">合并</span>
                </button>
                <button class="ribbonTile" id="btnFit" type="button">
                  <svg class="ico"><use href="#ico-fit"></use></svg>
                  <span class="btnText">适配视图</span>
                </button>
                <button
                  class="ribbonTile drop"
                  id="btnExport"
                  type="button"
                  aria-label="导出图谱"
                  aria-haspopup="dialog"
                  aria-controls="ribbonPopover"
                  aria-expanded="false"
                >
                  <svg class="ico"><use href="#ico-export"></use></svg>
                  <span class="btnText">导出</span>
                  <svg class="ico caret"><use href="#ico-caret"></use></svg>
                </button>
              </div>
              <div class="ribbonRow row2">
                <button class="ribbonTile detailBtn" id="btnEdgeDetail" type="button">
                  <svg class="ico"><use href="#ico-detail"></use></svg>
                  <span class="btnText">详细</span>
                </button>
                <button class="ribbonTile" id="btnRedo" type="button">
                  <svg class="ico"><use href="#ico-redo"></use></svg>
                  <span class="btnText">重做</span>
                </button>
                <button class="ribbonTile" id="btnUndo" type="button">
                  <svg class="ico"><use href="#ico-undo"></use></svg>
                  <span class="btnText">撤销</span>
                </button>
              </div>
            </div>
            <div class="ribbonCaption ribbonCaptionBaseline" id="graphToolbarOpsCaption">操作</div>
          </div>
        </section>

        <section class="card graphCard cardSolid" id="graphCard">
          <div class="tabsBar" id="viewsBar">
            <div class="viewsScroll" id="viewsScroll"></div>
            <button class="viewAdd" id="btnAddView" type="button" aria-label="新建视图">+</button>
          </div>

          <div class="graphWrap" id="graphWrap">
            <div id="graphContainer" class="graphContainer" aria-label="资金图谱"></div>
            <div class="graphSearchFloat" id="graphSearchFloat">
              <input class="input" id="graphSearch" placeholder="定位：卡号 / 账号 / 户名…" autocomplete="off" />
              <button class="iconBtn sm" id="graphSearchClear" title="清空" type="button" aria-label="清空搜索">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M6 6L18 18" stroke="rgba(2,6,23,.55)" stroke-width="2" stroke-linecap="round" />
                  <path d="M18 6L6 18" stroke="rgba(2,6,23,.55)" stroke-width="2" stroke-linecap="round" />
                </svg>
              </button>
            </div>
            <div class="graphStatsFloat" id="graphStatsFloat" aria-live="polite">
              <div class="graphStatsItem">
                <span class="graphStatsLabel">布局</span>
                <span class="graphStatsValue" id="graphStatsLayout">关联图布局</span>
              </div>
              <div class="graphStatsItem">
                <span class="graphStatsLabel">节点</span>
                <span class="graphStatsValue" id="graphStatsNodes">0</span>
              </div>
              <div class="graphStatsItem">
                <span class="graphStatsLabel">线条</span>
                <span class="graphStatsValue" id="graphStatsEdges">0</span>
              </div>
              <div class="graphStatsItem">
                <span class="graphStatsLabel">交易金额</span>
                <span class="graphStatsValue" id="graphStatsAmount">￥0</span>
              </div>
            </div>
            <div class="minimapFloat" id="minimapWrap" aria-label="缩略图">
              <div class="minimapTitle">缩略图</div>
              <div class="minimapBox" id="minimap"></div>
            </div>
            <div class="graphLoading" id="graphLoading" aria-hidden="true" style="display: none">
              <div class="loadingCard">
                <div class="loadingDot"></div>
                <div class="loadingText" id="graphLoadingText">正在生成图谱…</div>
              </div>
            </div>

            <div class="drawerWrap" id="drawerWrap">
              <aside class="drawer" id="drawer" aria-hidden="true">
                <div class="dHead">
                  <div class="dTitle" id="drawerTitle">详情</div>
                  <button class="dClose" id="drawerClose" type="button">关闭</button>
                </div>
                <div class="dBody" id="drawerBody"></div>
              </aside>
            </div>
          </div>
        </section>
      </section>
    </div>

    <div id="toastWrap" class="toastWrap"></div>
    <div id="contextMenu" class="ctxMenu" aria-hidden="true"></div>
    <div id="drillPopover" class="drillPopover" aria-hidden="true"></div>
    <div id="nodeInfoPopover" class="nodeInfoPopover" aria-hidden="true"></div>
    <div id="edgeInfoPopover" class="edgeInfoPopover" aria-hidden="true"></div>
    <div id="ribbonPopover" class="ribbonPopover" aria-hidden="true"></div>

    <svg style="display:none" aria-hidden="true">
      <symbol id="ico-font" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18h4l2-12h4l2 12h4" />
          <path d="M8 12h8" />
        </g>
      </symbol>
      <symbol id="ico-fontsize" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 18h6" />
          <path d="M8 18V6l-2 6h4" />
          <path d="M14 16h5" />
          <path d="M16.5 16V8l-1.5 4h3" />
        </g>
      </symbol>
