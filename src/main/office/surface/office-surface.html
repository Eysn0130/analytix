<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office 预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#525866;background:#f7f8fa}body{display:flex;flex-direction:column}main{flex:1;min-height:0;overflow:hidden;background:#f2f3f5}#qtcanvas{display:block;width:100%;height:100%;border:0;padding:0;outline:0}#qtcanvas:focus-visible{outline:1px solid #a3adbd;outline-offset:-1px}footer{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:#fafbfc;border-top:1px solid #e8eaee;font-size:11px;color:#757d8a}#status,#selection{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#selection{margin-left:auto;max-width:30%;text-align:right}footer[data-error=true]{color:#a13f3f}#kind:empty{display:none}#kind:not(:empty)::after{content:"·";margin-left:8px}@media(prefers-color-scheme:dark){html,body{color:#c1c5cd;background:#202124}main{background:#1d1f23}footer{background:#24262a;border-color:#32353b;color:#a4a9b2}#qtcanvas:focus-visible{outline-color:#6c7890}footer[data-error=true]{color:#f0a1a1}}
#viewControls{display:flex;align-items:center;gap:3px;margin-left:auto;flex:none}#viewControls[hidden],#pageControls[hidden]{display:none}#pageControls{display:flex;align-items:center;gap:3px;margin-right:6px}button{font:inherit;color:inherit;background:transparent;border:0;border-radius:3px;min-width:24px;height:24px;padding:0 5px;cursor:pointer}button:hover{background:#e9ecf1}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:1px solid #7b8ca8}#zoomValue{min-width:37px;text-align:center;font-variant-numeric:tabular-nums}#pageValue{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}@media(prefers-color-scheme:dark){button:hover{background:#363a42}}@media(max-width:520px){#selection{display:none}footer{gap:5px;padding:0 8px}#kind{display:none}}
</style></head><body>
<main id="preview" aria-busy="true"><canvas id="qtcanvas" contenteditable="false" tabindex="0" aria-label="Office 只读预览；可浏览和选择内容"></canvas></main>
<footer id="footer"><span id="kind"></span><span id="status" role="status" aria-live="polite">正在连接预览…</span><output id="selection" aria-label="选区位置"></output><div id="viewControls" role="group" aria-label="预览视图" hidden><span id="pageControls" hidden><button data-view="previous-page" aria-label="上一页" title="上一页">‹</button><output id="pageValue" aria-label="当前页与总页数"></output><button data-view="next-page" aria-label="下一页" title="下一页">›</button></span><button data-view="zoom-out" aria-label="缩小" title="缩小">−</button><output id="zoomValue" aria-label="实际缩放比例"></output><button data-view="zoom-in" aria-label="放大" title="放大">＋</button><button id="fitView" data-view="fit" aria-label="适配视图">适配</button></div></footer>
<script type="module" src="./office-surface.js"></script></body></html>
