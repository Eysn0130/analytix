<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office 预览</title>
<style>
:root{color-scheme:light dark;--preview-bg:#f3f4f6;--preview-bar:#fafbfc;--preview-line:#e5e7eb;--preview-text:#5e6673;--preview-hover:#e9ecf0;--preview-press:#dde2e9;--preview-focus:#536780;--preview-feedback:150ms}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--preview-text);background:var(--preview-bg)}body{display:flex;flex-direction:column}
main{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--preview-bg)}#qtcanvas{display:block;width:100%;height:100%;border:0;padding:0;outline:0}#qtcanvas:focus-visible{outline:2px solid var(--preview-focus);outline-offset:-2px}
main[aria-busy=true]::after{content:"正在打开预览…";position:absolute;inset:0;display:grid;place-items:center;background:var(--preview-bg);font-size:13px;pointer-events:none}
footer{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--preview-bar);border-top:1px solid var(--preview-line);font-size:11px;line-height:16px}
#status,#selection{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#selection{margin-left:auto;max-width:30%;text-align:right}#status{flex-shrink:1}footer[data-error=true]{color:#a13f3f}#kind{flex:none}#kind:empty{display:none}#kind:not(:empty)::after{content:"·";margin-left:8px}
#viewControls{display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}#viewControls[hidden],#pageControls[hidden]{display:none}#pageControls{display:flex;align-items:center;gap:2px;margin-right:8px;padding-right:8px;border-right:1px solid var(--preview-line)}
button{display:inline-flex;align-items:center;justify-content:center;font:inherit;color:inherit;background:transparent;border:0;border-radius:5px;min-width:28px;height:28px;padding:0 6px;cursor:pointer;transition:background-color var(--preview-feedback) ease-out,color var(--preview-feedback) ease-out}button:hover:not(:disabled){background:var(--preview-hover)}button:active:not(:disabled){background:var(--preview-press);transition-duration:0ms}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid var(--preview-focus);outline-offset:-2px}
button[data-view="zoom-in"],button[data-view="zoom-out"],#pageControls button{font-size:17px;font-weight:400}#zoomValue{min-width:42px;text-align:center;font-variant-numeric:tabular-nums}#pageValue{min-width:42px;text-align:center;font-variant-numeric:tabular-nums}#fitView{margin-left:4px}#fitView[aria-pressed=true]{background:var(--preview-hover);color:var(--preview-focus)}
@media(prefers-color-scheme:dark){:root{--preview-bg:#1d1f23;--preview-bar:#24262a;--preview-line:#393c42;--preview-text:#c1c5cd;--preview-hover:#363a42;--preview-press:#424853;--preview-focus:#adbdd4}footer[data-error=true]{color:#f0a1a1}}
@media(max-width:620px){#selection{display:none}#kind{display:none}}
@media(max-width:400px){footer{gap:4px;padding:0 6px}#status{font-size:10px}#pageControls{gap:0;margin-right:4px;padding-right:4px}#viewControls{gap:0}#zoomValue,#pageValue{min-width:34px}#fitView{margin-left:2px;padding:0 4px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<main id="preview" aria-busy="true"><canvas id="qtcanvas" contenteditable="false" tabindex="0" aria-label="Office 只读预览；可浏览和选择内容"></canvas></main>
<footer id="footer"><span id="kind"></span><span id="status" role="status" aria-live="polite">正在连接预览…</span><output id="selection" aria-label="选区位置"></output><div id="viewControls" role="group" aria-label="预览视图" hidden><span id="pageControls" hidden><button data-view="previous-page" aria-label="上一页" title="上一页">‹</button><output id="pageValue" aria-label="当前页与总页数"></output><button data-view="next-page" aria-label="下一页" title="下一页">›</button></span><button data-view="zoom-out" aria-label="缩小" title="缩小">−</button><output id="zoomValue" aria-label="实际缩放比例"></output><button data-view="zoom-in" aria-label="放大" title="放大">＋</button><button id="fitView" data-view="fit" aria-label="适配视图">适配</button></div></footer>
<script type="module" src="./office-surface.js"></script></body></html>
