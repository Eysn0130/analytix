<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office 预览</title>
<style>
:root{color-scheme:light dark;--preview-bg:#f3f4f6;--preview-bar:#fafbfc;--preview-line:#e5e7eb;--preview-text:#5e6673;--preview-hover:#e9ecf0;--preview-press:#dde2e9;--preview-focus:#536780;--preview-feedback:150ms}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--preview-text);background:var(--preview-bg)}body{display:flex;flex-direction:column}
main{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--preview-bg)}#qtcanvas{display:block;width:100%;height:100%;border:0;padding:0;outline:0}#qtcanvas:focus-visible{outline:2px solid var(--preview-focus);outline-offset:-2px}
main[aria-busy=true]::after{content:"正在打开预览…";position:absolute;inset:0;display:grid;place-items:center;background:var(--preview-bg);font-size:13px;pointer-events:none}
footer{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--preview-bar);border-top:1px solid var(--preview-line);font-size:11px;line-height:16px}
#status,#selection{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#selection{margin-left:auto;max-width:30%;text-align:right}#status{flex-shrink:1}footer[data-error=true]{color:#a13f3f}#kind{flex:none}#kind:empty{display:none}#kind:not(:empty)::after{content:"·";margin-left:8px}
#pointerActions{position:absolute;z-index:1;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);overflow:auto;scroll-behavior:auto;padding:4px;border:1px solid var(--preview-line);border-radius:8px;background:var(--preview-bar);color:var(--preview-text)}#pointerActions[hidden]{display:none}#pointerActions button{flex:0 1 auto;min-width:0;max-width:100%;min-height:28px;font:inherit;color:inherit;border:0;border-radius:6px;background:transparent;padding:4px 8px;white-space:normal;overflow-wrap:anywhere;cursor:pointer}#pointerActions button:hover:enabled{background:var(--preview-hover)}#pointerActions button:active:enabled{background:var(--preview-press)}#pointerActions button:focus-visible{outline:2px solid var(--preview-focus);outline-offset:-2px}#pointerActions button:disabled{opacity:.45;cursor:default}
#pointerActions .pointer-format{display:flex;align-items:center;gap:2px;max-width:100%;padding-right:4px;border-right:1px solid var(--preview-line)}#pointerActions input,#pointerActions select,#pointerActions output{height:28px;min-width:0;max-width:160px;border:1px solid var(--preview-line);border-radius:4px;background:var(--preview-bar);color:inherit;font:inherit;padding:3px 5px}#pointerActions input{width:64px}#pointerActions select{width:140px}#pointerActions output{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:20px}#pointerActions [data-format-control]:focus-visible{outline:2px solid var(--preview-focus);outline-offset:-2px}#pointerActions button[data-format-control]{width:28px;padding:3px}#pointerActions [data-format-control="bold"]{font-weight:700}#pointerActions [data-format-control="italic"]{font-style:italic}#pointerActions [data-format-control="underline"]{text-decoration:underline}#pointerActions button[aria-pressed="true"]{background:var(--preview-press)}#pointerActions button[aria-pressed="mixed"]{text-decoration-line:underline;text-decoration-style:dotted}#pointerActions[aria-busy="true"]{opacity:.7}
@media(prefers-color-scheme:dark){:root{--preview-bg:#1d1f23;--preview-bar:#24262a;--preview-line:#393c42;--preview-text:#c1c5cd;--preview-hover:#363a42;--preview-press:#424853;--preview-focus:#adbdd4}footer[data-error=true]{color:#f0a1a1}}
@media(max-width:620px){#selection{display:none}#kind{display:none}}
</style></head><body>
<main id="preview" aria-busy="true"><canvas id="qtcanvas" contenteditable="false" spellcheck="false" autocapitalize="off" autocomplete="off" tabindex="0" aria-label="Office 只读预览；可浏览和选择内容"></canvas></main>
<footer id="footer"><span id="kind"></span><span id="status" role="status" aria-live="polite">正在连接预览…</span><output id="selection" aria-label="选区位置"></output></footer>
<script type="module" src="./office-surface.js"></script></body></html>
